<!DOCTYPE html>
<html>
<head>
    <title>Table Example</title>
</head>
<body>

<h2>Student Table</h2>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Roll No</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>Kiran</td>
        <td>3</td>
        <td>85</td>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>4</td>
        <td>90</td>
    </tr>

</table>

</body>
</html>
