<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>


        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        div{
           
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding:30px;
            box-shadow: black 0px 0px 10px;
          
            
        }
    </style>

    <script>
        function fnshow(){
             var passwordField = document.querySelector("#password");
             passwordField.type = "text";
             var btnref=document.querySelector("#btn");
                btnref.innerText="Hide Password";
                    btnref.onclick=function(){
                        passwordField.type="password";
                        btnref.innerText="Show Password";
                        btnref.onclick=fnshow;
                    }
                    

            
        }
    </script>
</head>
<body>
    <div>
     <h2>Hide/Show Password</h2>   
    <input id="password" type="password" placeholder="Enter password"/>
    <button id="btn" onclick="fnshow()">Show Password</button>

    </div>
    
</body>
</html>
